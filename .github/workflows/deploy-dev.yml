name: Deploy dev backend

on:
  workflow_call:

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.BACKEND_URL }}
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      TARGET_ENV: dev
      RELEASE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}
      DEPLOYMENT_ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
      SUPABASE_AUTH_MIGRATED: ${{ vars.SUPABASE_AUTH_MIGRATED }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Validate environment and prepare secrets
        run: node scripts/ci/write-worker-secrets.mjs
      - run: npm ci
        working-directory: backend
      - uses: actions/download-artifact@v4
        with:
          name: backend-worker-${{ github.sha }}
          path: backend/.worker-build
      - name: Deploy the tested bundle
        id: deploy
        working-directory: backend
        run: node_modules/.bin/wrangler deploy .worker-build/worker-entry.js --no-bundle --env "$TARGET_ENV" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Check deployed health
        id: health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "$BACKEND_URL/api/health"
      - name: Record promotion result
        if: always() && steps.deploy.outcome != 'skipped'
        run: node scripts/ci/record-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome == 'success' && steps.health.outcome == 'success' && 'success' || 'failure' }}
      - name: Remove temporary credentials
        if: always()
        run: node -e 'require("fs").rmSync(require("path").join(process.env.RUNNER_TEMP, "worker-secrets.json"), {force:true})'
